<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUICKDRAW — The Outlaws of San Divisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1608; --paper:#f3e2b8; --wood:#6b4423; --wood2:#4a2c14; --wood3:#8a5a32;
  --gold:#ffd23f; --rust:#5a1e0c;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0e0710;overflow:hidden;font-family:'VT323',monospace;color:var(--paper);
  user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:center;
  overflow:hidden;outline:4px solid var(--wood2);border-radius:4px;background:#000;
  box-shadow:0 0 0 8px #0e0710,0 0 0 11px var(--wood),0 0 60px rgba(255,140,40,.25)}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#stage.aim{cursor:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5}
.screen.on{display:flex}

.btn{font-family:'Rye',serif;font-size:22px;color:var(--paper);cursor:pointer;padding:12px 26px;border-radius:6px;
  background:linear-gradient(180deg,var(--wood3),var(--wood) 55%,var(--wood2));border:3px solid #2a1608;
  box-shadow:0 5px 0 #24130a,inset 0 2px 0 rgba(255,220,160,.25);text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #24130a}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#f0b429 55%,#b97a10);color:var(--ink);text-shadow:none}
button:focus-visible,a:focus-visible,.poster:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.back{position:absolute;left:16px;top:14px;z-index:6;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--paper);
  text-decoration:none;padding:9px 10px;background:rgba(30,15,8,.8);border:2px solid var(--wood3);border-radius:4px}
.back:hover{background:var(--wood3)}

/* title */
#title{justify-content:flex-start;padding-top:96px;cursor:pointer;
  background:linear-gradient(180deg,rgba(14,7,16,.78) 0%,rgba(14,7,16,.62) 42%,rgba(14,7,16,0) 62%)}
.t-big{font-family:'Rye',serif;font-size:116px;color:var(--gold);letter-spacing:4px;
  text-shadow:5px 5px 0 #7a2410,10px 10px 0 rgba(0,0,0,.45)}
.t-plate{margin-top:10px;padding:8px 28px 6px;text-align:center;background:rgba(20,8,6,.82);border:2px solid #8a5a32;border-radius:6px;box-shadow:4px 5px 0 rgba(0,0,0,.4)}
.t-sub{font-family:'Rye',serif;font-size:28px;color:#fff3d6;margin-top:2px;text-shadow:3px 3px 0 rgba(0,0,0,.65)}
.t-es{font-size:28px;color:#ffcf8a;margin-top:2px;letter-spacing:2px;text-shadow:2px 2px 0 rgba(0,0,0,.7)}
.t-click{margin-top:auto;margin-bottom:56px;font-family:'Press Start 2P',monospace;font-size:16px;color:#fff;
  background:rgba(30,15,8,.78);padding:14px 20px;border:2px solid var(--gold);border-radius:4px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

/* stage select */
#select{background:rgba(14,7,16,.74);justify-content:flex-start;padding-top:22px}
.sel-head{font-family:'Rye',serif;font-size:42px;color:var(--gold);text-shadow:3px 3px 0 #7a2410}
.toggles{display:flex;gap:26px;margin:12px 0 18px;align-items:center}
.tg{display:flex;gap:6px;align-items:center}
.tg-label{font-family:'Press Start 2P',monospace;font-size:9px;color:#d8b98a;margin-right:6px}
.tg button{font-family:'Press Start 2P',monospace;font-size:10px;padding:10px 12px;background:rgba(30,15,8,.85);color:var(--paper);
  border:2px solid var(--wood3);border-radius:4px;cursor:pointer}
.tg button.on{background:var(--gold);color:var(--ink);border-color:#fff2b0}
.posters{display:grid;grid-template-columns:repeat(4,272px);gap:20px 22px}
.poster{position:relative;height:246px;color:var(--ink);border-radius:3px;padding:16px 14px 12px;text-align:center;cursor:pointer;
  background:radial-gradient(ellipse at 50% 40%,#f7e9c6 0%,#ead09a 68%,#d2ac6c 100%);
  box-shadow:4px 6px 0 rgba(0,0,0,.45);transform:rotate(var(--rot));transition:transform .15s}
.poster:hover{transform:rotate(0deg) scale(1.04)}
.poster::before{content:'';position:absolute;top:6px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;
  background:#666;box-shadow:inset -2px -2px 0 #222}
.p-se{font-family:'Rye',serif;font-size:30px;letter-spacing:2px;color:var(--rust);margin-top:2px}
.p-w{font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:3px;color:#7a4a2a}
.p-name{font-family:'Rye',serif;font-size:22px;line-height:1.1;margin:8px 0 2px;min-height:50px;display:flex;align-items:center;justify-content:center}
.p-gang{font-size:22px;color:#6a3a1a}
.p-topic{display:inline-block;margin-top:8px;font-family:'Press Start 2P',monospace;font-size:9px;padding:6px 8px;
  background:var(--rust);color:var(--paper);border-radius:3px}
.p-best{position:absolute;left:0;right:0;bottom:12px;font-family:'Rye',serif;font-size:17px;color:var(--rust)}
.poster.locked{filter:grayscale(.8) brightness(.62);cursor:not-allowed}
.poster.locked:hover{transform:rotate(var(--rot))}
.stamp{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) rotate(-14deg);font-family:'Rye',serif;font-size:24px;
  color:#8a1a0a;border:4px solid #8a1a0a;padding:4px 10px;border-radius:4px;background:rgba(243,226,184,.65);white-space:nowrap}
.sel-foot{margin-top:18px;font-size:25px;color:#e8cf9f;text-shadow:2px 2px 0 rgba(0,0,0,.6)}

/* cards */
.dim{background:rgba(14,7,16,.6)}
.card{width:740px;color:var(--ink);text-align:center;border-radius:4px;padding:20px 30px 22px;border:3px solid var(--wood3);
  background:radial-gradient(ellipse at 50% 35%,#f7e9c6 0%,#e8cd95 70%,#cfa766 100%);box-shadow:6px 8px 0 rgba(0,0,0,.5)}
.c-kick{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:2px;color:#7a4a2a}
.c-title{font-family:'Rye',serif;font-size:38px;color:var(--rust);margin:8px 0 0}
.c-bounty{font-family:'Rye',serif;font-size:62px;color:#3a1a08;line-height:1.1}
.stars{font-size:40px;letter-spacing:8px;color:#b8860b;line-height:1}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 10px}
.stat b{display:block;font-family:'Rye',serif;font-size:30px;font-weight:400}
.stat span{font-family:'Press Start 2P',monospace;font-size:7px;color:#7a4a2a;letter-spacing:1px}
.lessons{text-align:left;background:rgba(90,30,12,.08);border:2px dashed var(--wood3);border-radius:4px;padding:8px 14px 10px;
  font-size:23px;line-height:1.12;margin:6px 0 14px}
.lessons h4{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--rust);margin-bottom:6px;font-weight:400}
.c-btns{display:flex;gap:14px;justify-content:center}
.big-p{font-family:'Rye',serif;font-size:64px;color:var(--rust);margin:6px 0}
.c-text{font-size:28px;margin:6px 0 18px;line-height:1.15}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
.duel-col{background:rgba(90,30,12,.08);border:2px solid var(--wood3);border-radius:4px;padding:10px}
.duel-col.win{background:rgba(255,210,63,.35);border-color:#b8860b}
.duel-col h3{font-family:'Press Start 2P',monospace;font-size:12px;font-weight:400;color:var(--rust)}
.duel-col .c-bounty{font-size:48px}
.c-rule{font-size:28px;line-height:1.15;margin:8px 0 12px}
.c-tip{font-size:23px;color:#6a3a1a;margin:-4px 0 8px}
.ok{color:#1d7a2a;font-weight:bold} .no{color:#b8281a;font-weight:bold}
.ctrl{font-family:'Press Start 2P',monospace;font-size:8px;color:#7a4a2a;margin:6px 0 14px;line-height:2}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <a class="back" id="backLink" href="../index.html" title="Back to the Maths Arcade">◀ ARCADE</a>

  <div class="screen on" id="title" onclick="toSelect()">
    <div class="t-big">QUICKDRAW</div>
    <div class="t-plate">
      <div class="t-sub">The Outlaws of San Divisor</div>
      <div class="t-es">— los forajidos de San Divisor —</div>
    </div>
    <div class="t-click">CLICK TO RIDE IN</div>
  </div>

  <div class="screen" id="select">
    <div class="sel-head">PICK YOUR BOUNTY</div>
    <div class="toggles">
      <div class="tg"><span class="tg-label">RIDERS</span>
        <button id="m1" class="on" onclick="setMode(1)">1 PLAYER</button>
        <button id="m2" onclick="setMode(2)">2P TURNS</button>
        <button id="m3" onclick="setMode(3)">2P SHOWDOWN</button></div>
      <div class="tg"><span class="tg-label">LEVEL</span>
        <button id="d0" class="on" onclick="setDiff(0)">GREENHORN</button>
        <button id="d1" onclick="setDiff(1)">SHERIFF</button></div>
      <div class="tg"><button id="snd" onclick="toggleSound()">SOUND ON</button></div>
    </div>
    <div class="posters" id="posters"></div>
    <div class="sel-foot" id="selFoot">Left-click: shoot &nbsp;·&nbsp; R or right-click: reload &nbsp;·&nbsp; Esc: pause</div>
  </div>

  <div class="screen dim" id="summary"><div class="card" id="sumCard"></div></div>
  <div class="screen dim" id="handoff"><div class="card" id="handCard"></div></div>
  <div class="screen dim" id="brief"><div class="card" id="briefCard"></div></div>
  <div class="screen dim" id="pause"><div class="card">
    <div class="c-kick">TAKING A BREATHER</div>
    <div class="big-p">PAUSED</div>
    <div class="c-btns"><button class="btn gold" onclick="resume()">RESUME</button><button class="btn" onclick="toSelect()">QUIT TO STAGES</button></div>
  </div></div>
</div>

<script>
// =====================================================================
//  HELPERS
// =====================================================================
const W = 1280, H = 720, GROUND = 560;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function rng(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rint = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const rpick = (r, arr) => arr[Math.floor(r() * arr.length)];
function rshuffle(r, arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const isPrime = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const factorPairs = n => { const p = []; for (let a = 2; a * a <= n; a++) if (n % a === 0) p.push([a, n / a]); return p; };
const money = v => '$' + v.toLocaleString('en-US');
const easeOut = p => 1 - Math.pow(1 - clamp(p, 0, 1), 3);
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// =====================================================================
//  STATE
// =====================================================================
const G = {state:'title', mode:1, diff:0, sound:true, round:null, duel:null, sceneKey:'town', t:0, cd:0, prev:null,
  flash:0, shake:0, mx:W/2, my:H/2};
const FX = {parts:[], floats:[], holes:[], bolas:[], weeds:[], toast:null, banner:null};

// =====================================================================
//  SOUND (WebAudio, no files)
// =====================================================================
let AC = null, NB = null;
function ac(){ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function tone(f, d, type = 'square', v = .06, slide = null, delay = 0){
  if (!G.sound) return;
  try { const A = ac(), o = A.createOscillator(), gn = A.createGain(), t0 = A.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
    gn.gain.setValueAtTime(v, t0); gn.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(gn); gn.connect(A.destination); o.start(t0); o.stop(t0 + d + .02); } catch(e){}
}
function noise(d, v, freq, type = 'lowpass', delay = 0, sweep = null){
  if (!G.sound) return;
  try { const A = ac();
    if (!NB){ NB = A.createBuffer(1, A.sampleRate, A.sampleRate); const ch = NB.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
    const s = A.createBufferSource(), f = A.createBiquadFilter(), gn = A.createGain(), t0 = A.currentTime + delay;
    s.buffer = NB; f.type = type; f.frequency.setValueAtTime(freq, t0); if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t0 + d);
    gn.gain.setValueAtTime(v, t0); gn.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    s.connect(f); f.connect(gn); gn.connect(A.destination); s.start(t0); s.stop(t0 + d + .02); } catch(e){}
}
const sfx = {
  shot:   () => { noise(.32, .6, 2400, 'lowpass', 0, 260); tone(110, .12, 'square', .07, 45); },
  dry:    () => tone(1500, .03, 'square', .05),
  reload: () => { [0, .14, .28].forEach(d => tone(950, .03, 'square', .05, null, d)); tone(480, .07, 'square', .06, null, .5); },
  thud:   () => tone(170, .16, 'triangle', .14, 70),
  cash:   () => { tone(1320, .06, 'square', .035); tone(1760, .1, 'square', .035, null, .06); },
  wrong:  () => tone(210, .38, 'sawtooth', .06, 90),
  ping:   () => tone(2700, .45, 'sine', .05, 700),
  glass:  () => { noise(.28, .38, 3200, 'highpass'); [2100, 2900, 3700].forEach((f, i) => tone(f, .12, 'triangle', .03, null, i * .03)); },
  bola:   () => noise(.28, .3, 380, 'bandpass', 0, 2600),
  escape: () => tone(420, .3, 'triangle', .05, 230),
  bell:   () => tone(660, .25, 'triangle', .09),
  draw:   () => { tone(880, .45, 'triangle', .09); tone(1320, .45, 'triangle', .05, null, .05); },
  fanfare:() => [523, 659, 784, 1047].forEach((f, i) => tone(f, .17, 'square', .05, null, i * .1)),
  ghost:  () => { tone(330, .5, 'sine', .07, 660); tone(495, .5, 'sine', .04, 990, .05); },
  toss:   () => noise(.22, .1, 500, 'bandpass', 0, 1600),
  chug:   () => noise(.09, .045, 260, 'lowpass')
};
function toggleSound(){ G.sound = !G.sound; document.getElementById('snd').textContent = G.sound ? 'SOUND ON' : 'SOUND OFF'; }

// =====================================================================
//  SCENERY  (painted once into offscreen canvases)
//  Every scene = background + foreground (occluders) + slots where targets pop up
// =====================================================================
function winSlot(x, y, w, h, s = .8){ return {kind:'window', x, y, w, h, s, hx:x + w/2, hy:y + h + 12*s, mode:'up', dist:h + 26}; }
function doorSlot(x, y, w, h, bat = false){ const s = .72; return {kind:'door', bat, x, y, w, h, s, hx:x + w/2, hy:y + h - 55*s, mode:'side', dist:w + 44}; }
function riseSlot(cx, oy, occH, s = 1){ return {kind:'rise', x:cx - 58*s, y:oy - 140*s, w:116*s, h:occH + 140*s, s, hx:cx, hy:oy + 15*s, mode:'up', dist:132*s}; }
function caveSlot(x, y, w, h){ const s = .8; return {kind:'cave', x, y, w, h, s, hx:x + w/2, hy:y + h + 10*s, mode:'up', dist:h + 24}; }
function bottleWin(x, y, w, h){ const s = .9; return {kind:'window', x, y, w, h, s, hx:x + w/2, hy:y + h, mode:'up', dist:h + 14}; }
function bottleFence(cx){ return {kind:'rise', x:cx - 40, y:470, w:80, h:230, s:1, hx:cx, hy:606, mode:'up', dist:114}; }

// building windows/doors (shared by town + fence scenes)
const WIN = [[70,255,90,100],[260,255,90,100],[440,350,80,95],[690,330,84,95],[815,330,84,95],[985,240,88,100],[1125,240,88,100],[985,440,88,90]];
const DOORS = [[165,430,90,130,true],[540,440,76,120,false],[757,445,76,115,false],[1135,440,80,120,false]];
const BARRELS = [[330,612],[600,618],[1110,612]];
const CART = [860,600];

function skyAndGround(c, stops, sun, mesaCol, groundTop, groundBot, stars = true){
  const gr = c.createLinearGradient(0, 0, 0, 470); stops.forEach(s => gr.addColorStop(s[0], s[1]));
  c.fillStyle = gr; c.fillRect(0, 0, W, 470);
  const r = rng(3); c.fillStyle = 'rgba(255,240,220,.75)';
  if (stars) for (let i = 0; i < 46; i++) c.fillRect(Math.round(r() * W), Math.round(r() * 150), 2, 2);
  const sg = c.createRadialGradient(sun[0], sun[1], sun[2] * .5, sun[0], sun[1], sun[2] * 3.2);
  sg.addColorStop(0, 'rgba(255,205,100,.6)'); sg.addColorStop(1, 'rgba(255,120,60,0)');
  c.fillStyle = sg; c.fillRect(0, 0, W, 470);
  c.fillStyle = '#ffd56e'; c.beginPath(); c.arc(sun[0], sun[1], sun[2], 0, Math.PI * 2); c.fill();
  c.fillStyle = mesaCol; c.beginPath(); c.moveTo(0, 470);
  [[0,428],[90,428],[118,398],[262,398],[282,420],[420,420],[452,382],[602,382],[630,430],[760,430],[792,394],[982,394],[1010,424],[1150,424],[1182,404],[1280,404]]
    .forEach(p => c.lineTo(p[0], p[1]));
  c.lineTo(W, 470); c.fill();
  const gg = c.createLinearGradient(0, 470, 0, H); gg.addColorStop(0, groundTop); gg.addColorStop(1, groundBot);
  c.fillStyle = gg; c.fillRect(0, 470, W, H - 470);
  c.fillStyle = 'rgba(60,25,10,.18)'; const r2 = rng(11);
  for (let i = 0; i < 260; i++) c.fillRect(Math.round(r2() * W), Math.round(480 + r2() * 240), 3, 2);
}

function facade(c, x, top, w, col, trim, style){
  const h = GROUND - top;
  c.fillStyle = col; c.fillRect(x, top, w, h);
  c.fillStyle = 'rgba(0,0,0,.13)';
  if (style === 'stone'){ for (let y = top + 10, row = 0; y < GROUND; y += 18, row++){ c.fillRect(x, y, w, 2);
      for (let xx = x + (row % 2 ? 0 : 22); xx < x + w; xx += 44) c.fillRect(xx, y, 2, 18); } }
  else if (style === 'adobe'){ const r = rng(x); for (let i = 0; i < 90; i++) c.fillRect(x + r() * w, top + r() * h, 4, 2); }
  else { for (let y = top + 8; y < GROUND; y += 12) c.fillRect(x, y, w, 2); }
  c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x + w - 6, top, 6, h);
  c.fillStyle = trim; c.fillRect(x - 6, top - 10, w + 12, 12); c.fillRect(x - 3, top + 2, w + 6, 4);
}
function board(c, cx, y, w, h, text, size, sub){
  c.fillStyle = '#3a200e'; c.fillRect(cx - w/2 - 4, y - 4, w + 8, h + 8);
  c.fillStyle = '#ecd59e'; c.fillRect(cx - w/2, y, w, h);
  c.fillStyle = '#5a1e0c'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = `${size}px Rye`; c.fillText(text, cx, y + h/2 + (sub ? -6 : 2));
  if (sub){ c.font = '18px VT323'; c.fillText(sub, cx, y + h - 10); }
}
function wantedDecor(c, x, y){
  c.fillStyle = '#e9d29a'; c.fillRect(x, y, 34, 44); c.fillStyle = '#5a1e0c'; c.fillRect(x + 4, y + 4, 26, 5);
  c.fillStyle = '#7a5a3a'; c.fillRect(x + 9, y + 13, 16, 16); c.fillStyle = '#5a1e0c'; c.fillRect(x + 4, y + 33, 26, 3); c.fillRect(x + 4, y + 38, 18, 3);
}

function townBG(){
  const cv = mk(), c = cv.getContext('2d');
  skyAndGround(c, [[0,'#1d0f33'],[.35,'#4a1d4f'],[.62,'#b2403a'],[.85,'#f08a3c'],[1,'#ffc35a']], [525, 205, 78], '#3e1838', '#b8743e', '#7a4423');
  facade(c, 30, 180, 360, '#8b4a2b', '#4a2410');
  facade(c, 410, 280, 230, '#8a7a62', '#4e4234', 'stone');
  facade(c, 660, 250, 270, '#e6d3ad', '#a8432a', 'adobe');
  facade(c, 950, 170, 300, '#5e3f33', '#2e1d16');
  // pulperia roof tiles
  c.fillStyle = '#a8432a'; for (let x = 654; x < 936; x += 18){ c.beginPath(); c.arc(x + 9, 248, 9, Math.PI, 0); c.fill(); }
  board(c, 210, 192, 220, 46, 'SALOON', 34);

      return {key:x.join(':'), label:{ratio:x}, why:{escape:`${x.join(' : ')} = ${A} — divide every part by ${m}. That one got away!`}}; },
    bad: r => { for (let k = 0; k < 30; k++){ let x, msg; const ty = r();
        if (!three && ty < .35 && base[0] !== base[1]){ const m = rint(r, 1, 5); x = [base[1] * m, base[0] * m];
          msg = `${x.join(' : ')} is the wrong way round — ${A} means ${base[0]} first, then ${base[1]}. Order matters!`; }
        else if (ty < .65){ const d = rint(r, 1, 3); x = base.map(v => v + d);

        else { const m = rint(r, 2, three ? 4 : (hard ? 7 : 5)), j = rint(r, 0, base.length - 1); x = base.map((v, i) => v * (i === j ? m + 1 : m));

}

function decoyMultiple(r, k, hard){
  if (hard && r() < .45){                     // sneaky: multiple of a factor of k, but not of k
    const ds = []; for (let d = 2; d < k; d++) if (k % d === 0) ds.push(d);
    if (ds.length){ const d = rpick(r, ds); for (let i = 0; i < 30; i++){ const v = d * rint(r, 2, Math.floor(15 * k / d)); if (v % k && v > k) return v; } }
  }

}

function buildFence(r, hard){
  const bases = rshuffle(r, hard ? [[5,6],[3,8],[5,8],[4,7],[7,10],[4,9],[3,10],[2,9]] : [[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[3,5],[1,5]]).slice(0, 3);
  const q = [];
  bases.forEach(([a, b], si) => {

    for (let vi = 0; vi < 4; vi++){

function decoyFraction(r, a, b, hard){
  for (let tries = 0; tries < 30; tries++){
    const type = rpick(r, ['add','add','mixed','flip','near']);
    let f, msg;
    if (type === 'add'){ const d = rint(r, 1, 4); f = [a + d, b + d];
      msg = `${f[0]}/${f[1]} ≠ ${a}/${b}. Adding ${d} to top and bottom changes the fraction — multiply instead!`; }
    else if (type === 'mixed'){ const m1 = rint(r, 2, hard ? 8 : 5), m2 = m1 + rint(r, 1, 2); f = r() < .5 ? [a*m1, b*m2] : [a*m2, b*m1];
      msg = `${f[0]}/${f[1]} ≠ ${a}/${b}: the top and bottom were multiplied by different numbers.`; }
    else if (type === 'flip'){ const m = rint(r, 1, 4); f = [b*m, a*m];
      msg = `${f[0]}/${f[1]} is upside-down — it's bigger than 1, but ${a}/${b} is less than 1.`; }
    else { const m = rint(r, 2, hard ? 9 : 5); f = r() < .5 ? [a*m + 1, b*m] : [a*m, b*m + 1];
      const g = gcd(f[0], f[1]);
      msg = g > 1 ? `${f[0]}/${f[1]} simplifies to ${f[0]/g}/${f[1]/g}, not ${a}/${b}.` : `${f[0]}/${f[1]} ≠ ${a}/${b} — so close! ${a}/${b} = ${a*m}/${b*m}.`; }
    if (f[0] * b !== f[1] * a) return {f, msg};
  }
  return {f:[a + 1, b + 1], msg:`${a+1}/${b+1} ≠ ${a}/${b}. Adding 1 to top and bottom changes the fraction!`};
}

function pickFree(rd){
  const active = rd.targets.filter(t => !t.done).length;
  if (active >= (rd.show ? [2, 3] : rd.st.max)[G.diff]) return null;
  const free = rd.slots.filter(s => !s.occ && s.cool <= 0 && s !== rd.lastSlot);
  if (!free.length) return null;
  const s = free[Math.floor(rd.r() * free.length)]; rd.lastSlot = s; return s;
}
function nearestFree(rd, p){
  const free = rd.slots.filter(s => !s.occ && s.cool <= 0);

  free.sort((a, b) => Math.hypot(a.hx - p.x, a.hy - p.y) - Math.hypot(b.hx - p.x, b.hy - p.y));
  return free[0];
}

    t.shake = Math.max(0, t.shake - dt);

    if (t.state === 'in'){ t.pop = Math.min(1, t.pop + dt / .22); if (t.pop >= 1) t.state = 'up'; }
    else if (t.state === 'up'){ t.t += dt; if (t.t >= t.stay){ t.state = 'out'; if (!t.done) escape(rd, t); } }

    else if (t.state === 'oops'){ t.oopsT -= dt; if (t.oopsT <= 0) t.state = 'out'; }
  });
  rd.targets = rd.targets.filter(t => !t.dead);

  rd.players.forEach(P => {
    if (P.reloadT > 0){ P.reloadT -= dt; if (P.reloadT <= 0){ P.reloadT = 0; P.bullets = 6; } }
    if (P.autoReload > 0){ P.autoReload -= dt; if (P.autoReload <= 0) startReload(P); }

}

// ---------- scoring (always for the player who acted: rd.cur) ----------
const PCOL = ['#ff5a4a', '#3ab0ff'];
const sOf = t => t.slot ? t.slot.s : (t.s || 1);
function headOf(t){ if (t.fly) return {x:t.x, y:t.y - 112 * t.s};
  const o = offsetOf(t); return {x:t.slot.hx + o.dx, y:t.slot.hy + o.dy - 112 * t.slot.s}; }
function reward(rd, t, base, note){
  const P = PL(rd);
  P.streak++; P.best = Math.max(P.best, P.streak); P.stats.correct++;
  const quick = Math.round(40 * clamp(1 - t.t / t.stay, 0, 1)), amt = (base + quick) * multOf(P.streak);
  P.bounty += amt; const h = headOf(t);
  floater(h.x, h.y, (rd.show ? `P${rd.cur + 1} ` : '') + '+' + money(amt), rd.show ? PCOL[rd.cur] : '#ffd23f');
  if (note) floater(h.x, h.y + 34, note, '#fff3d6', 1.5);
  sfx.cash();
}
function catchT(rd, t){
  reward(rd, t, 100); t.done = true;
  if (t.kind === 'bottle'){ shatter(t); kill(t); sfx.glass(); }
  else if (t.kind === 'ghost' && !t.unmasked){ poof(t); t.vanish = true; t.state = 'down'; sfx.ghost(); }
  else { t.state = 'down'; if (!t.bola) hatFly(t); sfx.thud(); }
}
function wrongT(rd, t, msg, o = {}){
  const P = PL(rd);
  P.streak = 0; P.stats.wrong++; const pen = o.pen || 150; P.bounty = Math.max(0, P.bounty - pen);
  if (rd.show) P.stun = 1;     // showdown: a wrong shot jams your gun for a second
  const h = headOf(t); floater(h.x, h.y, (rd.show ? `P${rd.cur + 1} ` : '') + '-' + money(pen), '#ff5a4a');
  sfx.wrong(); toast(msg, 'bad'); lesson(rd, msg);
  if (o.keep){ t.shake = .4; return; }
  t.done = true;
  if (t.kind === 'bottle'){ shatter(t); kill(t); sfx.glass(); }
  else { if (t.kind === 'ghost' && !t.unmasked){ t.unmasked = true; const h = headOf(t);
      part({type:'sheet', x:h.x, y:h.y + 30, vx:(Math.random() - .5) * 200, vy:-340, g:600, vr:(Math.random() - .5) * 8, life:1}); }
    t.state = 'oops'; t.oopsT = .75; t.shake = .5; t.angry = true; }
}
function escape(rd, t){
  if (rd.st.onEscape) rd.st.onEscape(rd, t);
  if (!t.good) return;
  const h = headOf(t); floater(h.x, h.y, 'GOT AWAY!', '#ffa040'); sfx.escape();
  const m = t.why.escape || 'An outlaw got away!'; toast(m, 'bad'); lesson(rd, m);
  if (rd.show) return;          // showdown: nobody loses money when both miss
  const P = rd.players[0]; P.streak = 0; P.stats.escaped++; P.bounty = Math.max(0, P.bounty - 50);
}
function lesson(rd, m){ if (!rd.lessons.includes(m)) rd.lessons.push(m); }
function note(rd, m){ if (!rd.notes.includes(m)) rd.notes.push(m); }
function defaultShot(rd, t){ if (t.good) catchT(rd, t); else wrongT(rd, t, t.why.wrong || 'Not wanted!'); }
const validT = t => !t.done && !(t.wait > 0) && t.pop >= .45 && (t.state === 'in' || t.state === 'up');

// ---------- weapons: mouse (1 player / turns) ----------
function fireGun(){
  const rd = G.round, P = rd.players[0]; rd.cur = 0;
  if (P.reloadT > 0){ sfx.dry(); return; }
  if (P.bullets <= 0){ sfx.dry(); startReload(P); return; }
  P.bullets--; P.stats.shots++; sfx.shot(); G.flash = .07; G.shake = .09;
  const t = targetAt(G.mx, G.my);
  if (t){ P.stats.hits++; (rd.st.onShot || defaultShot)(rd, t, 'gun'); }
  else { FX.holes.push({x:G.mx, y:G.my, life:4}); dust(G.mx, G.my); }
  if (P.bullets === 0) P.autoReload = .3;
}
function startReload(P){ P = P || (G.round && G.round.players[0]); if (!P || P.reloadT > 0 || P.bullets === 6) return; P.autoReload = 0; P.reloadT = RELOAD; sfx.reload(); }
function throwBola(){
  const rd = G.round, P = rd.players[0]; if (P.bolaCD > 0) return;
  P.bolaCD = .4; sfx.bola(); FX.bolas.push({x0:W/2, y0:H + 20, x1:G.mx, y1:G.my, t:0, done:false, life:.35, pl:0});
}

// ---------- weapons: keyboard showdown (crosshair rests in the middle, hold a direction to snap to 1 of 8 targets) ----------
function dirFromKeys(i){
  const k = G.keys, [u, d, l, r] = i === 0 ? ['KeyW','KeyS','KeyA','KeyD'] : ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  const dx = (k.has(r) ? 1 : 0) - (k.has(l) ? 1 : 0), dy = (k.has(d) ? 1 : 0) - (k.has(u) ? 1 : 0);
  if (!dx && !dy) return null;
  return (dy < 0 ? 'U' : dy > 0 ? 'D' : '') + (dx < 0 ? 'L' : dx > 0 ? 'R' : '');
}
const slotFor = (rd, dir) => dir ? rd.slots.find(s => s.dir === dir) : null;
function aimPoint(rd, dir){ const s = slotFor(rd, dir); if (!s) return {x:CENTER.x, y:CENTER.y};
  return {x:s.hx, y:s.hy - (s.bottle ? 37 : 41) * s.s}; }
function updateAim(rd, dt){
  rd.players.forEach((P, i) => { P.dir = dirFromKeys(i); const a = aimPoint(rd, P.dir), k = Math.min(1, dt * 28);
    P.ax += (a.x - P.ax) * k; P.ay += (a.y - P.ay) * k; P.flash = Math.max(0, P.flash - dt); });
}
function showFire(i, tool){
  const rd = G.round, P = rd.players[i];
  if (P.stun > 0 || P.cool > 0){ sfx.dry(); return; }
  const slot = slotFor(rd, P.dir), a = aimPoint(rd, P.dir);
  if (tool === 'bola'){
    if (!rd.st.alt || P.bolaCD > 0) return;
    P.bolaCD = .4; P.cool = .15; sfx.bola();
    FX.bolas.push({x0:i ? W - 80 : 80, y0:H + 20, x1:a.x, y1:a.y, t:0, done:false, life:.35, pl:i, slot});
    return;
  }
  P.cool = .28; P.stats.shots++; P.flash = .07; sfx.shot(); G.shake = .06;
  const t = slot && slot.occ;
  if (t && validT(t)){ P.stats.hits++; rd.cur = i; (rd.st.onShot || defaultShot)(rd, t, 'gun'); }
  else { FX.holes.push({x:a.x + (Math.random() - .5) * 16, y:a.y + (Math.random() - .5) * 16, life:3}); dust(a.x, a.y); }
}
function offsetOf(t){ if (t.fly) return {dx:0, dy:0}; const s = t.slot, p = easeOut(t.pop); let dx = 0, dy = 0;
  if (s.mode === 'up') dy = (1 - p) * s.dist; else dx = -(1 - p) * s.dist;
  if (t.shake > 0) dx += Math.sin(G.t * 70) * 5;
  return {dx, dy}; }
function boxOf(t){
  if (t.fly) return {x0:t.x - 36 * t.s, x1:t.x + 36 * t.s, y0:t.y - 122 * t.s, y1:t.y};
  const s = t.slot, o = offsetOf(t), k = s.s;
  const b = t.kind === 'bottle' ? [-32, 32, -118, 0] : [-50, 50, -132, s.kind === 'door' ? 56 : 0];
  return { x0:Math.max(s.x, s.hx + o.dx + b[0] * k), x1:Math.min(s.x + s.w, s.hx + o.dx + b[1] * k),

}
function targetAt(x, y){
  const rd = G.round; if (!rd) return null;
  for (let i = rd.targets.length - 1; i >= 0; i--){
    const t = rd.targets[i]; if (!validT(t)) continue;
    const b = boxOf(t); if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) return t;
  }

// =====================================================================
//  EFFECTS
// =====================================================================
function floater(x, y, text, color, life = 1.1){ FX.floats.push({x, y, text, color, life, max:life}); }

function part(o){ FX.parts.push(Object.assign({vx:0, vy:0, g:900, life:1, size:5, rot:0, vr:0}, o, {max:o.life || 1})); }
function dust(x, y){ for (let i = 0; i < 8; i++) part({x, y, vx:(Math.random() - .5) * 160, vy:-Math.random() * 160, g:400, life:.5, size:4, color:'#d6a46a'}); }
function sparks(t){ const h = headOf(t); for (let i = 0; i < 10; i++) part({x:h.x, y:h.y + 70 * sOf(t), vx:(Math.random() - .5) * 400, vy:-Math.random() * 300, life:.35, size:3, color:'#ffe27a'}); }

function poof(t){ const h = headOf(t); for (let i = 0; i < 18; i++) part({x:h.x + (Math.random() - .5) * 70, y:h.y + 20 + Math.random() * 90,
  vx:(Math.random() - .5) * 120, vy:-40 - Math.random() * 140, g:-40, life:.8, size:9, color:'rgba(225,238,255,.85)'}); }
function shatter(t){
  const o = offsetOf(t), x = t.fly ? t.x : t.slot.hx + o.dx, y = t.fly ? t.y - 50 * t.s : t.slot.hy + o.dy - 50 * t.slot.s;
  const col = t.look.mate ? '#8a5a2a' : t.look.glass;
  for (let i = 0; i < 18; i++) part({x, y, vx:(Math.random() - .5) * 520, vy:-Math.random() * 420, life:.8, size:5 + Math.random() * 4, color:col, vr:(Math.random() - .5) * 20});
  for (let i = 0; i < 8; i++) part({x, y, vx:(Math.random() - .5) * 300, vy:-Math.random() * 300, life:.6, size:4, color:'#f3e2b8'});
}
function updateFX(dt){
  FX.parts.forEach(p => { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; });
  FX.parts = FX.parts.filter(p => p.life > 0);
  FX.floats.forEach(f => { f.life -= dt; f.y -= 42 * dt; }); FX.floats = FX.floats.filter(f => f.life > 0);
  FX.holes.forEach(h => h.life -= dt); FX.holes = FX.holes.filter(h => h.life > 0);
  if (FX.toast && (FX.toast.life -= dt) <= 0) FX.toast = null;
  if (FX.banner && (FX.banner.life -= dt) <= 0) FX.banner = null;
  FX.bolas.forEach(b => { b.t += dt / .16;
    if (b.t >= 1 && !b.done){ b.done = true; const rd = G.round;
      if (rd && G.state === 'play'){
        const t = b.slot !== undefined ? (b.slot && b.slot.occ && validT(b.slot.occ) ? b.slot.occ : null) : targetAt(b.x1, b.y1);
        rd.cur = b.pl || 0;
        if (t){ rd.players[rd.cur].stats.hits++; rd.st.onShot(rd, t, 'bola'); } else dust(b.x1, b.y1); } }
    if (b.done) b.life -= dt; });
  FX.bolas = FX.bolas.filter(b => b.life > 0);
  // tumbleweeds
  if (Math.random() < dt * .08 && FX.weeds.length < 1) FX.weeds.push({x:-60, y:690, r:22 + Math.random() * 10, vx:110 + Math.random() * 80, rot:0, hop:0});
  FX.weeds.forEach(w => { w.x += w.vx * dt; w.rot += w.vx * dt / w.r; w.hop = Math.abs(Math.sin(w.x / 60)) * 18; });
  FX.weeds = FX.weeds.filter(w => w.x < W + 80);
  G.flash = Math.max(0, G.flash - dt); G.shake = Math.max(0, G.shake - dt);
}

// =====================================================================

const cv = document.getElementById('cv'), g = cv.getContext('2d');

function clipSlot(c, s){ c.beginPath(); if (s.kind === 'cave') archPath(c, s.x, s.y, s.w, s.h); else c.rect(s.x, s.y, s.w, s.h); c.clip(); }
function drawSlot(c, s){
  const o = s.occ, open = o ? clamp(o.pop * 1.6, 0, 1) : 0;
  if ((s.kind === 'window' || s.kind === 'door') && (o || s.bat || s.interior)){ c.fillStyle = s.interior || '#1a0c06'; c.fillRect(s.x, s.y, s.w, s.h);
    c.fillStyle = 'rgba(255,190,90,.12)'; c.fillRect(s.x, s.y, s.w, s.h * .4); }
  if (o){
    const off = offsetOf(o);
    const bob = o.kind === 'ghost' && !o.unmasked ? Math.sin(G.t * 3 + o.id) * 5 : 0;
    c.save(); clipSlot(c, s); c.translate(s.hx + off.dx, s.hy + off.dy + bob); c.scale(s.s, s.s);
    if (o.vanish) c.globalAlpha = clamp(o.pop, 0, 1);
    if (o.kind === 'bottle') bottleLocal(c, o); else if (o.kind === 'ghost' && !o.unmasked) ghostLocal(c, o); else personLocal(c, o);
    c.restore();

    shutter(c, s.x, s.y, lw, s.h, s.shutC); shutter(c, s.x + s.w - lw, s.y, lw, s.h, s.shutC); } }
  if (s.kind === 'door' && !s.bat) doorLeaf(c, s.x, s.y, s.w * (1 - open * .85), s.h);
}

function render(){
  const sc = SCENES[G.sceneKey]; if (!sc) return;
  const rd = G.round;
  g.save();
  if (G.shake > 0) g.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  g.drawImage(sc.bg, 0, 0);
  if (sc.under) sc.under(g);
  FX.holes.forEach(h => { g.globalAlpha = Math.min(1, h.life); g.fillStyle = '#2a1608'; g.beginPath(); g.arc(h.x, h.y, 5, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,230,180,.5)'; g.lineWidth = 2; g.beginPath(); g.arc(h.x, h.y, 8, 0, 7); g.stroke(); g.globalAlpha = 1; });
  (rd ? rd.slots : sc.slots).forEach(s => drawSlot(g, s));
  if (rd) rd.targets.forEach(t => { if (!t.fly || t.dead || t.wait > 0) return;
    g.save(); g.translate(t.x, t.y - 50 * t.s); g.rotate(t.rot); g.translate(0, 50 * t.s); g.scale(t.s, t.s); bottleLocal(g, t); g.restore(); });
  g.drawImage(sc.fg, 0, 0);
  if (sc.over) sc.over(g);

  if (rd) rd.targets.forEach(t => { if (t.angry && t.state === 'oops'){ const h = headOf(t);
    speech(g, h.x + 36, h.y - 6, '¡EH!'); } });
  FX.weeds.forEach(w => tumbleweed(g, w));
  FX.parts.forEach(p => {
    g.globalAlpha = clamp(p.life / p.max * 2, 0, 1);
    if (p.type === 'hat'){ g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(p.s, p.s); g.translate(0, 115); hatLocal(g, p.look); g.restore(); }
    else if (p.type === 'sheet'){ g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = 'rgba(240,244,250,.92)'; g.fillRect(-46, -34, 92, 68); g.restore(); }
    else { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.color; g.fillRect(-p.size/2, -p.size/2, p.size, p.size); g.restore(); }
    g.globalAlpha = 1;
  });
  FX.bolas.forEach(b => {
    const p = Math.min(1, b.t), x = b.x0 + (b.x1 - b.x0) * p, y = b.y0 + (b.y1 - b.y0) * p - Math.sin(p * Math.PI) * 60, a = G.t * 25;
    g.strokeStyle = '#3a2416'; g.lineWidth = 3; g.fillStyle = '#2a1608';

      g.beginPath(); g.moveTo(x, y); g.lineTo(bx, by); g.stroke(); g.beginPath(); g.arc(bx, by, 6, 0, 7); g.fill(); }
  });
  FX.floats.forEach(f => { g.globalAlpha = clamp(f.life / f.max * 2, 0, 1); g.font = '34px VT323'; g.textAlign = 'center'; g.textBaseline = 'middle';

    bigText(g, labels[i], W/2, H/2 - 10, i === 3 ? 76 : 150, '#ffd23f');
    if (i === 3) bigText(g, 'DRAW!', W/2, H/2 + 70, 34, '#fff3d6');

}
function bigText(c, t, x, y, size, col){ c.font = `${size}px Rye`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = size / 8; c.strokeStyle = '#3a1206'; c.strokeText(t, x, y); c.fillStyle = col; c.fillText(t, x, y); }
function speech(c, x, y, t){ c.fillStyle = '#fff3d6'; rr(c, x, y - 34, 74, 36, 8); c.fill(); c.beginPath(); c.moveTo(x + 8, y); c.lineTo(x - 6, y + 12); c.lineTo(x + 22, y); c.fill();

function burst(c, x, y){ c.fillStyle = '#fff2a8'; c.beginPath(); for (let i = 0; i < 10; i++){ const a = i * Math.PI / 5, r = i % 2 ? 10 : 30;

function showCrosshairs(c, rd){
  rd.players.forEach((P, i) => {

function ring(c, x, y){ c.beginPath(); c.arc(x, y, 20, 0, Math.PI * 2); c.stroke();

function plank(c, x, y, w, h){ c.fillStyle = 'rgba(42,22,8,.88)'; rr(c, x, y, w, h, 6); c.fill(); c.strokeStyle = '#8a5a32'; c.lineWidth = 3; rr(c, x, y, w, h, 6); c.stroke(); }
function drawHUD(c, rd){
  const P = rd.players[0];
  plank(c, 14, 12, 250, 74);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.font = '9px "Press Start 2P"'; c.fillStyle = '#d8b98a'; c.fillText(G.mode === 2 ? `PLAYER ${rd.player} · BOUNTY` : 'BOUNTY', 28, 34);
  c.font = '36px Rye'; c.fillStyle = '#ffd23f'; c.fillText(money(P.bounty), 26, 74);
  plank(c, 1016, 12, 250, 74);
  c.font = '9px "Press Start 2P"'; c.fillStyle = '#d8b98a'; c.fillText('STREAK', 1030, 34); c.fillText('TARGETS LEFT', 1030, 74);
  c.textAlign = 'right'; c.font = '30px Rye'; const m = multOf(P.streak);
  c.fillStyle = m > 1 ? '#ffd23f' : '#f3e2b8'; c.fillText(`${P.streak}  ×${m}`, 1252, 44);
  const left = rd.queue.reduce((n, q) => n + (q.volley ? q.volley.length : 1), 0) + rd.pending.length + rd.targets.filter(t => !t.done).length;
  c.font = '26px VT323'; c.fillStyle = '#f3e2b8'; c.fillText(left, 1252, 78);
  drawPoster(c, rd.poster, rd.posterPulse);
  // revolver cylinder
  const cx = 66, cy = 652, a = P.reloadT > 0 ? (1 - P.reloadT / RELOAD) * Math.PI * 4 : 0;
  c.fillStyle = 'rgba(42,22,8,.85)'; c.beginPath(); c.arc(cx, cy, 48, 0, 7); c.fill();
  c.fillStyle = '#7a7a82'; c.beginPath(); c.arc(cx, cy, 40, 0, 7); c.fill(); c.fillStyle = '#5a5a62'; c.beginPath(); c.arc(cx, cy, 10, 0, 7); c.fill();
  for (let i = 0; i < 6; i++){ const an = a + i * Math.PI / 3 - Math.PI / 2, bx = cx + Math.cos(an) * 24, by = cy + Math.sin(an) * 24, full = P.reloadT <= 0 && i < P.bullets;
    c.fillStyle = full ? '#e0b040' : '#1a1a1e'; c.beginPath(); c.arc(bx, by, 9, 0, 7); c.fill();
    if (full){ c.fillStyle = '#a07020'; c.beginPath(); c.arc(bx, by, 4, 0, 7); c.fill(); } }
  c.textAlign = 'left'; c.font = '9px "Press Start 2P"';
  const reloadTip = rd.st.alt ? 'R: RELOAD' : 'R / RIGHT-CLICK: RELOAD';
  plank(c, 118, 634, P.reloadT > 0 ? 150 : (rd.st.alt ? 120 : 216), 34);
  c.fillStyle = P.reloadT > 0 ? '#ffd23f' : (P.bullets === 0 ? '#ff6a4a' : '#d8b98a');
  c.fillText(P.reloadT > 0 ? 'RELOADING...' : reloadTip, 130, 656);
  if (rd.st.alt){
    plank(c, 1000, 622, 266, 60);
    const bx = 1032, by = 652; c.strokeStyle = '#c8a070'; c.lineWidth = 3; c.fillStyle = '#e0c090';
    [[-14,10],[14,10],[0,-14]].forEach(p => { c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + p[0], by + p[1]); c.stroke(); c.beginPath(); c.arc(bx + p[0], by + p[1], 6, 0, 7); c.fill(); });
    c.fillStyle = P.bolaCD > 0 ? '#8a7a6a' : '#ffd23f'; c.font = '10px "Press Start 2P"'; c.fillText('BOLEADORAS', 1056, 646);
    c.fillStyle = '#d8b98a'; c.font = '8px "Press Start 2P"'; c.fillText('RIGHT-CLICK / SPACE', 1056, 666);
  }
  drawVault(c, rd, 116);
  drawMessages(c, -712, 680);
}
function drawVault(c, rd, y){
  const v = rd.vault; if (!v) return;
  c.font = '28px VT323';
  const chips = v.pairs.map(([a, b]) => { const fa = v.found.has(a), fb = v.found.has(b);
    return {txt:`${fa ? a : '?'} × ${fb ? b : '?'}`, st: fa && fb ? 2 : (fa || fb ? 1 : 0)}; });
  const ws = chips.map(ch => c.measureText(ch.txt).width + 20);
  c.font = '9px "Press Start 2P"'; const head = v.done ? 'VAULT CRACKED!' : 'VAULT · FACTOR PAIRS', hw = c.measureText(head).width + 24;
  const total = hw + ws.reduce((n, w) => n + w + 8, 0) + 10, x0 = W / 2 - total / 2;
  plank(c, x0, y, total, 42);
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = v.done ? '#7aff9a' : '#d8b98a'; c.fillText(head, x0 + 14, y + 22);
  let x = x0 + hw + 4; c.font = '28px VT323';
  chips.forEach((ch, i) => { c.fillStyle = ch.st === 2 ? 'rgba(255,210,63,.28)' : 'rgba(0,0,0,.3)'; rr(c, x, y + 7, ws[i], 28, 5); c.fill();
    c.fillStyle = ch.st === 2 ? '#ffd23f' : ch.st === 1 ? '#f3e2b8' : '#8a7a6a'; c.textAlign = 'center'; c.fillText(ch.txt, x + ws[i] / 2, y + 22); x += ws[i] + 8; });
}
function drawShowHUD(c, rd){
  rd.players.forEach((P, i) => {
    const x = i ? 1016 : 14, col = PCOL[i];
    plank(c, x, 12, 250, 74); c.fillStyle = col; c.fillRect(x + 4, 16, 6, 66);
    c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.font = '9px "Press Start 2P"'; c.fillStyle = col; c.fillText(`PLAYER ${i + 1}`, x + 20, 34);
    c.textAlign = 'right'; c.fillStyle = P.stun > 0 ? '#ff6a4a' : '#d8b98a';
    c.fillText(P.stun > 0 ? 'GUN JAMMED!' : `STREAK ${P.streak} ×${multOf(P.streak)}`, x + 238, 34);
    c.textAlign = 'left'; c.font = '36px Rye'; c.fillStyle = '#ffd23f'; c.fillText(money(P.bounty), x + 18, 74);
    const txt = i ? 'ARROWS aim · ENTER shoot' + (rd.st.alt ? ' · R-SHIFT bolas' : '') : 'WASD aim · SPACE shoot' + (rd.st.alt ? ' · L-SHIFT bolas' : '');
    c.font = '24px VT323'; const w = c.measureText(txt).width + 28, px = i ? W - 14 - w : 14;
    plank(c, px, 684, w, 30); c.fillStyle = col; c.textBaseline = 'middle'; c.fillText(txt, px + 14, 700);
  });
  drawPoster(c, rd.poster, rd.posterPulse);
  drawVault(c, rd, 676);
  drawMessages(c, 296, 720);
}
function wrapLines(c, text, maxW){
  const words = text.split(' '), lines = []; let line = '';
  words.forEach(w => { const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test; });
  if (line) lines.push(line); return lines;
}
function drawMessages(c, toastY, maxW){
  if (FX.toast){ const t = FX.toast; c.globalAlpha = clamp(t.life / .4, 0, 1);
    c.font = '28px VT323'; const lines = wrapLines(c, t.text, maxW - 36);
    const w = Math.min(maxW, Math.max(...lines.map(l => c.measureText(l).width)) + 36), h = 14 + lines.length * 28;
    if (toastY < 0) toastY = -toastY - h;          // negative = anchored to the bottom edge
    c.fillStyle = t.kind === 'bad' ? 'rgba(80,12,6,.92)' : 'rgba(12,60,20,.92)'; rr(c, W/2 - w/2, toastY, w, h, 8); c.fill();
    c.fillStyle = '#fff3d6'; c.textAlign = 'center'; c.textBaseline = 'middle';
    lines.forEach((l, i) => c.fillText(l, W/2, toastY + 21 + i * 28)); c.globalAlpha = 1; }
  if (FX.banner){ const b = FX.banner; c.globalAlpha = clamp(b.life / .4, 0, 1);
    c.fillStyle = 'rgba(20,8,4,.7)'; c.fillRect(0, 262, W, b.b ? 130 : 90);
    bigText(c, b.a, W/2, 306, 50, '#ffd23f');
    if (b.b){ c.font = '40px VT323'; c.fillStyle = '#fff3d6'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(b.b, W/2, 360); }
    c.globalAlpha = 1; }
}
function drawPoster(c, p, pulse){
  if (!p) return;
  const w = 360, h = 100, x = W/2 - w/2, y = 8, s = 1 + pulse * .08;
  c.save(); c.translate(W/2, y + h/2); c.scale(s, s); c.translate(-W/2, -(y + h/2));
  c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(x + 5, y + 6, w, h);
  const gr = c.createRadialGradient(W/2, y + 40, 10, W/2, y + 50, 220); gr.addColorStop(0, '#f7e9c6'); gr.addColorStop(1, '#d2ac6c');
  c.fillStyle = gr; c.fillRect(x, y, w, h);
  c.fillStyle = '#666'; [[x + 10, y + 10], [x + w - 10, y + 10]].forEach(n => { c.beginPath(); c.arc(n[0], n[1], 4, 0, 7); c.fill(); });
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#5a1e0c';
  c.font = '18px Rye'; c.fillText(p.top, W/2, y + 22);
  if (p.frac){ c.font = '36px VT323'; c.fillStyle = '#2a1608';
    c.fillText(p.frac[0], W/2, y + 50); c.fillRect(W/2 - 22, y + 64, 44, 3); c.fillText(p.frac[1], W/2, y + 82); }
  else if (p.lines){ c.font = '28px VT323'; c.fillStyle = '#2a1608'; c.fillText(p.lines[0], W/2, y + 52); c.fillText(p.lines[1], W/2, y + 80); }
  else { let fs = 32; c.font = `${fs}px Rye`; while (c.measureText(p.main).width > w - 28 && fs > 16){ fs -= 2; c.font = `${fs}px Rye`; }
    c.fillStyle = '#2a1608'; c.fillText(p.main, W/2, y + (p.sub ? 54 : 64));
    if (p.sub){ c.font = '24px VT323'; c.fillStyle = '#5a1e0c'; c.fillText(p.sub, W/2, y + 85); } }
  c.restore();
}

// =====================================================================
//  SCREENS & FLOW
// =====================================================================
function showScreen(id){ ['title','select','summary','handoff','pause','brief'].forEach(s => document.getElementById(s).classList.toggle('on', s === id)); }

function toSelect(){
  ac();   // unlock audio on first click
  G.state = 'select'; G.round = null; G.duel = null; G.sceneKey = 'town';
  FX.toast = null; FX.banner = null; FX.holes = [];
  document.getElementById('stage').classList.remove('aim'); document.getElementById('backLink').style.display = '';
  renderPosters(); showScreen('select');
}
function setMode(m){ G.mode = m; ['m1','m2','m3'].forEach((id, i) => document.getElementById(id).classList.toggle('on', i + 1 === m));
  document.getElementById('selFoot').innerHTML = m === 3
    ? 'SHOWDOWN on one keyboard &nbsp;·&nbsp; P1: WASD aim + SPACE shoot &nbsp;·&nbsp; P2: ARROWS aim + ENTER shoot'
    : 'Left-click: shoot &nbsp;·&nbsp; R or right-click: reload &nbsp;·&nbsp; Esc: pause'; }
function setDiff(d){ G.diff = d; ['d0','d1'].forEach((id, i) => document.getElementById(id).classList.toggle('on', i === d)); renderPosters(); }
function bestKey(id){ return `quickdraw-best-${id}-${G.diff}`; }
function getBest(id){ try { return +localStorage.getItem(bestKey(id)) || 0; } catch(e){ return 0; } }
function setBest(id, v){ try { if (v > getBest(id)) localStorage.setItem(bestKey(id), v); } catch(e){} }

function renderPosters(){
  const play = Object.entries(STAGES).map(([id, s]) => {
    const best = getBest(id);
    return `<div class="poster" tabindex="0" style="--rot:${s.rot}deg" onclick="pickStage('${id}')" onkeydown="if(event.key==='Enter')pickStage('${id}')">
      <div class="p-se">SE BUSCA</div><div class="p-w">W A N T E D</div>
      <div class="p-name">${s.name}</div><div class="p-gang">${s.gang}</div><div class="p-topic">${s.topic}</div>
      <div class="p-best">${best ? 'BEST ' + money(best) : 'REWARD: UNCLAIMED'}</div></div>`;
  });
  const soon = SOON.map(s => `<div class="poster locked" style="--rot:${s.rot}deg">
      <div class="p-se">SE BUSCA</div><div class="p-w">W A N T E D</div>
      <div class="p-name">${s.name}</div><div class="p-gang">${s.gang}</div><div class="p-topic">${s.topic}</div>
      <div class="stamp">PRÓXIMAMENTE</div></div>`);
  document.getElementById('posters').innerHTML = play.concat(soon).join('');
}
function pickStage(id, skip){
  G.pick = {id, seed:(Math.random() * 1e9) >>> 0};
  if (G.mode === 2) G.duel = {stage:id, seed:G.pick.seed, res:[]};
  if (skip) startRound(id, G.pick.seed, 1); else showBrief(id);
}
function showBrief(id){
  const st = STAGES[id], b = st.brief;
  G.state = 'brief'; G.round = null; G.sceneKey = G.mode === 3 ? 'plaza' : st.scene;
  const ctrl = G.mode === 3
    ? `P1: WASD aim · SPACE shoot${st.alt ? ' · L-SHIFT bolas' : ''}<br>P2: ARROWS aim · ENTER shoot${st.alt ? ' · R-SHIFT bolas' : ''}`
    : `LEFT-CLICK shoot · R reload${st.alt ? ' · RIGHT-CLICK or SPACE: bolas' : ' · RIGHT-CLICK reload'}`;
  document.getElementById('briefCard').innerHTML = `
    <div class="c-kick">${st.topic} · ${G.diff ? 'SHERIFF' : 'GREENHORN'}${G.mode === 3 ? ' · SHOWDOWN' : G.mode === 2 ? ' · 2P TURNS' : ''}</div>
    <div class="c-title">${st.name}</div>
    <div class="c-rule">${b.rule}</div>
    <div class="lessons"><h4>EXAMPLE</h4>${b.ex}</div>
    ${b.tip ? `<div class="c-tip">${b.tip}</div>` : ''}
    <div class="ctrl">${ctrl}</div>
    <div class="c-btns"><button class="btn gold" onclick="rideBrief()">RIDE! ▸</button><button class="btn" onclick="toSelect()">BACK</button></div>`;
  showScreen('brief');
}
function rideBrief(){ if (G.state === 'brief') startRound(G.pick.id, G.pick.seed, 1); }

function endRound(){
  const rd = G.round; G.state = 'summary';
  document.getElementById('stage').classList.remove('aim');
  closeVault(rd);
  if (rd.show) return showdownResult(rd);
  const P = rd.players[0], s = P.stats, dec = s.correct + s.wrong + s.escaped, acc = dec ? s.correct / dec : 0;
  const stars = acc >= .95 ? 3 : acc >= .8 ? 2 : acc >= .6 ? 1 : 0;
  setBest(rd.stageId, P.bounty);
  const titles = ['THE OUTLAWS GOT AWAY', 'NOT BAD, PARTNER', "FINE SHOOTIN'", 'LEGEND OF THE PAMPA'];
  let btns;
  if (G.mode === 2){
    G.duel.res[rd.player - 1] = {bounty:P.bounty, stars};
    btns = rd.player === 1 ? `<button class="btn gold" onclick="handoff()">PLAYER 2 ▸</button>` : `<button class="btn gold" onclick="duelResult()">WHO WON? ▸</button>`;
  } else btns = `<button class="btn gold" onclick="pickStage('${rd.stageId}', true)">RIDE AGAIN</button><button class="btn" onclick="toSelect()">STAGES</button>`;
  const shotAcc = s.shots ? Math.round(s.hits / s.shots * 100) + '%' : '—';
  document.getElementById('sumCard').innerHTML = `
    <div class="c-kick">${G.mode === 2 ? 'PLAYER ' + rd.player + ' · ' : ''}${rd.st.name} · ${G.diff ? 'SHERIFF' : 'GREENHORN'}</div>
    <div class="c-title">${titles[stars]}</div>
    <div class="c-bounty">${money(P.bounty)}</div>
    <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <div class="stats">
      <div class="stat"><b>${s.correct}</b><span>CORRECT</span></div>
      <div class="stat"><b>${s.wrong}</b><span>WRONG SHOTS</span></div>
      <div class="stat"><b>${s.escaped}</b><span>GOT AWAY</span></div>
      <div class="stat"><b>${P.best}</b><span>BEST STREAK</span></div>
      <div class="stat"><b>${shotAcc}</b><span>AIM</span></div>
    </div>
    ${lessonsHTML(rd)}
    <div class="c-btns">${btns}</div>`;
  showScreen('summary'); sfx.fanfare();
}
function lessonsHTML(rd){
  const L = rd.lessons.slice(0, 4), N = rd.notes.slice(-3);
  return `<div class="lessons"><h4>LESSONS FROM THE TRAIL</h4>${L.length ? L.map(l => '• ' + l).join('<br>') : 'A clean round — not a single mistake. ¡Bien ahí!'}${
    N.length ? `<h4 style="margin-top:8px">REMEMBER</h4>${N.map(n => '★ ' + n).join('<br>')}` : ''}</div>`;
}
function showdownResult(rd){
  const [a, b] = rd.players, win = a.bounty === b.bounty ? 0 : (a.bounty > b.bounty ? 1 : 2);
  const col = (p, P) => `<div class="duel-col ${win === p ? 'win' : ''}"><h3 style="color:${p === 1 ? '#b8281a' : '#1a6ab0'}">PLAYER ${p}</h3>
    <div class="c-bounty">${money(P.bounty)}</div>
    <div style="font-size:24px">${P.stats.correct} correct · ${P.stats.wrong} wrong · best streak ${P.best}</div></div>`;
  document.getElementById('sumCard').innerHTML = `
    <div class="c-kick">SHOWDOWN · ${rd.st.name} · ${G.diff ? 'SHERIFF' : 'GREENHORN'}</div>
    <div class="big-p" style="font-size:54px">${win ? 'PLAYER ' + win + ' WINS!' : "IT'S A DRAW!"}</div>
    <div class="duel">${col(1, a)}${col(2, b)}</div>
    ${lessonsHTML(rd)}
    <div class="c-btns"><button class="btn gold" onclick="pickStage('${rd.stageId}', true)">REMATCH</button><button class="btn" onclick="toSelect()">STAGES</button></div>`;
  showScreen('summary'); sfx.fanfare();
}
function handoff(){
  G.state = 'handoff';
  document.getElementById('handCard').innerHTML = `
    <div class="c-kick">2 PLAYER DUEL · ${STAGES[G.duel.stage].name}</div>
    <div class="big-p">PLAYER 2</div>
    <div class="c-text">Take the mouse, partner. Same town, same outlaws, same order.<br>The bounty to beat: <b>${money(G.duel.res[0].bounty)}</b></div>
    <div class="c-btns"><button class="btn gold" onclick="startRound(G.duel.stage, G.duel.seed, 2)">I'M READY</button></div>`;
  showScreen('handoff');
}
function duelResult(){
  G.state = 'handoff';
  const [a, b] = G.duel.res, win = a.bounty === b.bounty ? 0 : (a.bounty > b.bounty ? 1 : 2);
  const col = (p, r) => `<div class="duel-col ${win === p ? 'win' : ''}"><h3>PLAYER ${p}</h3><div class="c-bounty">${money(r.bounty)}</div>
    <div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)}</div></div>`;
  document.getElementById('handCard').innerHTML = `
    <div class="c-kick">2 PLAYER DUEL · ${STAGES[G.duel.stage].name}</div>
    <div class="big-p">${win ? 'PLAYER ' + win + ' WINS!' : "IT'S A DRAW!"}</div>
    <div class="duel">${col(1, a)}${col(2, b)}</div>
    <div class="c-btns"><button class="btn gold" onclick="pickStage(G.duel.stage, true)">REMATCH</button><button class="btn" onclick="toSelect()">STAGES</button></div>`;
  showScreen('handoff'); sfx.fanfare();
}
function pauseGame(){ if (G.state !== 'play' && G.state !== 'countdown') return; G.prev = G.state; G.state = 'paused';
  document.getElementById('stage').classList.remove('aim'); showScreen('pause'); }
function resume(){ G.state = G.prev || 'play'; document.getElementById('stage').classList.add('aim'); showScreen(null); }

// =====================================================================
//  INPUT
// =====================================================================
const stageEl = document.getElementById('stage');
G.keys = new Set();
function toLocal(e){ const r = cv.getBoundingClientRect(); G.mx = (e.clientX - r.left) / r.width * W; G.my = (e.clientY - r.top) / r.height * H; }
stageEl.addEventListener('mousemove', toLocal);
stageEl.addEventListener('mousedown', e => {
  if (G.state !== 'play' || G.round.show) return; toLocal(e); e.preventDefault();
  if (e.button === 0) fireGun();
  else if (e.button === 2){ if (G.round.st.alt) throwBola(); else startReload(); }
});
stageEl.addEventListener('contextmenu', e => { if (G.state === 'play' || G.state === 'countdown') e.preventDefault(); });
stageEl.addEventListener('mouseleave', () => { if (G.state === 'play' && !G.round.show) startReload(); });
const SHOW_KEYS = ['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','NumpadEnter','ShiftLeft','ShiftRight'];
document.addEventListener('keydown', e => {
  if (G.state === 'brief'){ if (e.key === 'Enter'){ e.preventDefault(); rideBrief(); } else if (e.key === 'Escape') toSelect(); return; }
  if (e.key === 'Escape'){ if (G.state === 'paused') resume(); else pauseGame(); return; }
  const rd = G.round;
  if (rd && rd.show && (G.state === 'play' || G.state === 'countdown')){
    if (SHOW_KEYS.includes(e.code)) e.preventDefault();
    G.keys.add(e.code);
    if (G.state !== 'play' || e.repeat) return;
    if (e.code === 'Space') showFire(0, 'gun');
    else if (e.code === 'ShiftLeft') showFire(0, 'bola');
    else if (e.code === 'Enter' || e.code === 'NumpadEnter') showFire(1, 'gun');
    else if (e.code === 'ShiftRight') showFire(1, 'bola');
    return;
  }
  if (G.state !== 'play') return;
  if (e.key === 'r' || e.key === 'R') startReload();
  if (e.key === ' '){ e.preventDefault(); if (rd.st.alt) throwBola(); }
});
document.addEventListener('keyup', e => G.keys.delete(e.code));
window.addEventListener('blur', () => G.keys.clear());

// =====================================================================
//  LOOP
// =====================================================================
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; G.t += dt;
  if (G.state === 'countdown'){
    G.cd += dt; const step = Math.min(3, Math.floor(G.cd / .7));
    if (step !== G.cdStep){ G.cdStep = step; step === 3 ? sfx.draw() : sfx.bell(); }
    if (G.cd >= 2.8) G.state = 'play';
  }
  if ((G.state === 'play' || G.state === 'countdown') && G.round && G.round.show) updateAim(G.round, dt);
  if (G.state === 'play') updateRound(dt);
  if (G.state !== 'paused') updateFX(dt);
  render();
  requestAnimationFrame(loop);
}
function fit(){ const s = Math.min(innerWidth / 1300, innerHeight / 740); stageEl.style.transform = `translate(-50%,-50%) scale(${s})`; }
window.addEventListener('resize', fit); fit();
buildScenes();
if (document.fonts && document.fonts.load){
  Promise.all(['20px Rye', '20px VT323', '10px "Press Start 2P"'].map(f => document.fonts.load(f))).then(buildScenes).catch(() => {});
}
requestAnimationFrame(loop);
</script>
